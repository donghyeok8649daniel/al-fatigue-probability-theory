name: Validate Standalone 1D FEM Scaffold

on:
  push:
    paths:
      - 'fem1d/**'
      - 'simulations/visualize_fem1d.py'
      - 'tests/test_fem1d_visualizer.py'
      - 'docs/MILESTONE14_1D_FEM_SCAFFOLD.md'
      - '.github/workflows/validate-fem1d.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-fem1d:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Build 1D FEM C solver
        run: make -C fem1d

      - name: Run analytical uniform-bar self-test
        run: make -C fem1d self-test

      - name: Test Python visualizer helpers
        run: python -m unittest discover -s tests -p 'test_fem1d_visualizer.py'

      - name: Generate reversible 1D FEM demo history
        run: |
          rm -rf results/data/fem1d_demo results/figures/fem1d_demo
          ./fem1d/bin/fem1d_solver \
            --elements 40 \
            --length-m 0.05 \
            --area-m2 1e-6 \
            --young-pa 69e9 \
            --stress-mean-mpa 50 \
            --stress-amplitude-mpa 100 \
            --frequency-hz 20 \
            --cycles 2 \
            --steps-per-cycle 80 \
            --outdir results/data/fem1d_demo

      - name: Generate Python FEM visualizations
        run: |
          python simulations/visualize_fem1d.py \
            --input-dir results/data/fem1d_demo \
            --output-dir results/figures/fem1d_demo

      - name: Commit reproducible demo outputs
        shell: bash
        run: |
          git add results/data/fem1d_demo results/figures/fem1d_demo
          if git diff --cached --quiet; then
            echo 'No FEM demo output changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Generate validated standalone 1D FEM demo outputs'
          git push
