name: Validate Standalone 1D FEM Scaffold

on:
  push:
    paths:
      - 'fem1d/**'
      - 'simulations/visualize_fem1d.py'
      - 'simulations/fem_tension_ui.py'
      - 'simulations/fem_tension_app.py'
      - 'simulations/fem_geometry_mesh.py'
      - 'simulations/fem_mesh_ui.py'
      - 'simulations/run_tensile_mesh_projection.py'
      - 'tests/test_fem1d_visualizer.py'
      - 'tests/test_fem_tension_ui.py'
      - 'tests/test_fem_tension_app.py'
      - 'tests/test_fem_geometry_mesh.py'
      - 'tests/test_fem_mesh_projection.py'
      - 'docs/MILESTONE14_1D_FEM_SCAFFOLD.md'
      - 'docs/MILESTONE14A_2D_3D_TENSION_UI.md'
      - 'docs/MILESTONE14B_INTEGRATED_TENSION_APP.md'
      - 'docs/MILESTONE17_2D_3D_MESH_CAD_NORMAL_ONLY.md'
      - 'docs/VARIABLE_DEFINITIONS_FEM_GEOMETRY.md'
      - '.github/workflows/validate-fem1d.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate-fem1d:
    runs-on: ubuntu-latest
    env:
      MPLBACKEND: Agg
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Build 1D FEM C solver
        run: make -C fem1d

      - name: Run analytical uniform-bar self-test
        run: make -C fem1d self-test

      - name: Test Python FEM visualizers and integrated app helpers
        run: python -m unittest discover -s tests -p 'test_fem*.py'

      - name: Run integrated app headless smoke test
        run: |
          rm -rf .tmp/fem1d_app_smoke
          python -m simulations.fem_tension_app \
            --headless-smoke \
            --solver fem1d/bin/fem1d_solver \
            --no-auto-build \
            --output-dir .tmp/fem1d_app_smoke/data \
            --preview-dir .tmp/fem1d_app_smoke/figures
          test -f .tmp/fem1d_app_smoke/data/nodes.csv
          test -f .tmp/fem1d_app_smoke/data/elements.csv
          test -f .tmp/fem1d_app_smoke/figures/tension_2d_peak.png
          test -f .tmp/fem1d_app_smoke/figures/tension_3d_peak.png

      - name: Validate actual 2D and 3D mesh projections
        run: |
          python -m simulations.run_tensile_mesh_projection \
            --history-csv .tmp/fem1d_app_smoke/data/elements.csv \
            --field stress_pa \
            --dimension 2 \
            --nx 12 --ny 3 \
            --output-dir .tmp/fem1d_mesh_2d
          python -m simulations.run_tensile_mesh_projection \
            --history-csv .tmp/fem1d_app_smoke/data/elements.csv \
            --field stress_pa \
            --dimension 3 \
            --nx 12 --ny 3 --nz 2 \
            --output-dir .tmp/fem1d_mesh_3d
          test -f .tmp/fem1d_mesh_2d/geometry_mesh.npz
          test -f .tmp/fem1d_mesh_2d/mesh_field_preview.png
          test -f .tmp/fem1d_mesh_3d/geometry_mesh.npz
          test -f .tmp/fem1d_mesh_3d/mesh_field_preview.png

      - name: Generate reversible 1D FEM demo history
        run: |
          rm -rf results/data/fem1d_demo results/figures/fem1d_demo
          ./fem1d/bin/fem1d_solver \
            --elements 40 \
            --length-m 0.05 \
            --area-m2 1e-6 \
            --young-pa 69e9 \
            --stress-mean-mpa 50 \
            --stress-amplitude-mpa 100 \
            --frequency-hz 20 \
            --cycles 2 \
            --steps-per-cycle 80 \
            --outdir results/data/fem1d_demo

      - name: Generate basic 1D plots
        run: |
          python simulations/visualize_fem1d.py \
            --input-dir results/data/fem1d_demo \
            --output-dir results/figures/fem1d_demo

      - name: Generate tensile-only 2D and 3D previews
        run: |
          python -m simulations.fem_tension_ui \
            --input-dir results/data/fem1d_demo \
            --output-dir results/figures/fem1d_demo \
            --field stress \
            --save-previews

      - name: Commit reproducible demo outputs
        shell: bash
        run: |
          git add results/data/fem1d_demo results/figures/fem1d_demo
          if git diff --cached --quiet; then
            echo 'No FEM demo output changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'Generate validated tensile-only 2D and 3D FEM previews'
          git push
