name: Validate Active Theory And Synchronize Korean Headers

on:
  push:
    paths:
      - '.github/workflows/apply-korean-code-headers.yml'
      - 'requirements.txt'
      - 'theory/**'
      - 'tests/**'
      - 'simulations/**'
      - 'firmware/**'
      - 'docs/MILESTONE10_EXACT_DISTRIBUTION_TRANSPORT.md'
      - 'docs/MILESTONE11_EXACT_P_SHAPE.md'
      - 'docs/MILESTONE12_PHYSICAL_STATISTICAL_P.md'
      - 'docs/MILESTONE13_1D_STATISTICAL_CELL.md'
      - 'docs/MILESTONE13A_FINITE_SNAPSHOT_CORRECTION.md'
      - 'docs/VARIABLE_DEFINITIONS_DISTRIBUTION_TRANSPORT.md'
      - 'docs/VARIABLE_DEFINITIONS_P_SHAPE.md'
      - 'docs/VARIABLE_DEFINITIONS_PHYSICAL_P.md'
      - 'docs/VARIABLE_DEFINITIONS_STATISTICAL_CELL.md'
      - 'results/data/result_manifest.json'
      - 'tools/add_korean_code_headers.py'
      - 'tools/apply_exact_transport_supersession.py'
      - 'tools/apply_physical_statistical_p_status.py'
      - 'tools/apply_statistical_cell_status.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Python dependencies
        run: python -m pip install -r requirements.txt

      - name: Synchronize exact nonlinear transport status
        run: python tools/apply_exact_transport_supersession.py

      - name: Synchronize physical-statistical P status
        run: python tools/apply_physical_statistical_p_status.py

      - name: Synchronize 1D statistical-cell status
        run: python tools/apply_statistical_cell_status.py

      - name: Apply Korean file headers
        run: python tools/add_korean_code_headers.py

      - name: Verify generated headers
        run: python tools/add_korean_code_headers.py --check

      - name: Run unit tests
        run: python -m unittest discover -s tests

      - name: Generate Milestone 12 dimensionless diagnostics
        run: python -m simulations.run_normal_lj_physical_distribution

      - name: Generate Milestone 13 correlation-cell diagnostics
        run: python -m simulations.run_normal_lj_spatial_correlation

      - name: Synchronize latest status after diagnostics
        run: python tools/apply_statistical_cell_status.py

      - name: Commit synchronized status and generated diagnostics
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No synchronization changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md docs theory simulations tests firmware results tools
          git commit -m 'Synchronize latest 1D statistical-cell status and diagnostics'
          git push
