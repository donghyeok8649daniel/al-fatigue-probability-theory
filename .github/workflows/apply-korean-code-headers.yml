name: Apply Korean Code Headers

on:
  push:
    paths:
      - '.github/workflows/apply-korean-code-headers.yml'
      - 'tools/add_korean_code_headers.py'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply Korean file headers
        run: python tools/add_korean_code_headers.py

      - name: Record code-header rule in style guide
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('docs/STYLE_GUIDE.md')
          text = p.read_text(encoding='utf-8')
          marker = '## Korean code-file header rule'
          if marker not in text:
              english = '''\n## Korean code-file header rule\n\nEvery active source, simulation, test, and firmware code/header file must begin with a Korean navigation comment that states at least:\n\n- the role of the file;\n- the main functions/classes or public symbols;\n- the implementation/output role when useful;\n- a reminder that scientific classification belongs to the detailed docstrings and theory documents.\n\nUse `python tools/add_korean_code_headers.py` to regenerate these headers after adding or renaming functions. Use `--check` to detect stale headers.\n'''
              korean = '''\n## 한국어 코드 파일 상단 안내 규칙\n\n모든 활성 source, simulation, test, firmware code/header 파일은 맨 위에 최소한 다음 내용을 적은 한국어 탐색용 주석을 둔다.\n\n- 파일이 하는 일;\n- 주요 함수/클래스 또는 공개 symbol;\n- 필요하면 구현 또는 출력 결과의 역할;\n- 물리적 가정·근사·정확성 분류는 세부 docstring과 theory 문서를 따라야 한다는 주의.\n\n함수 추가/이름변경 뒤에는 `python tools/add_korean_code_headers.py`로 헤더를 다시 생성한다. `--check` 옵션으로 오래된 헤더를 검사할 수 있다.\n'''
              sep = '\n---\n\n# 한국어 번역'
              if sep in text:
                  left, right = text.split(sep, 1)
                  text = left.rstrip() + '\n' + english + sep + right.rstrip() + '\n' + korean + '\n'
              else:
                  text = text.rstrip() + '\n' + english + '\n---\n' + korean + '\n'
              p.write_text(text, encoding='utf-8')
          PY

      - name: Verify generated headers
        run: python tools/add_korean_code_headers.py --check

      - name: Commit generated header updates
        shell: bash
        run: |
          if git diff --quiet; then
            echo 'No header changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add theory simulations tests firmware docs/STYLE_GUIDE.md
          git commit -m 'Add Korean navigation headers to active code files'
          git push
